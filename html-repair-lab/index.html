<!DOCTYPE html>
<html lang="en">
<head>
  <title>Home</title>
   <meta charset="UTF-8">
</head>

<body>
    <h1>Tech Club</h1>

<nav>
  <a href="#about">About</a>
  <a href="#events">Events</a>
  <a href="#join">Join</a>
</nav>

<h2 id="about">About Us</h2>
<p>We are a student technology club learning how to build useful things on the web.</p>

<section id="events">
  <h2>Upcoming Events</h2>

  <ul>
    
      <li>
        <article>
        <h3>HTML Workshop</h3>
        <p>Saturday at 10am</p>
         </article>
      </li>

    
      <li>
        <article>
        <h3>Git Practice</h3>
        <p>Sunday at 2pm</p>
         </article>
      </li>
   
  </ul>
</section>

<img src="club.jpg" alt="image">


<section id="join">
  <h2>Join the Club</h2>

  <form>
   <label for="name">Name</label>
    <input type="text" name="name" id="name">

    <label for="email">Email</label>
    <input type="email" name="email" id="email">

     <fieldset>
       <legend> Why do you want to join?</legend>
       <label for="message">Your Message</label>
       <br>
       <textarea name="message" id="message" cols="20" rows="15" placeholder="Type your message here"></textarea>
    <br>
    </fieldset>

    <button type="submit">Submit</button>
  </form>
</section>

<footer>
  Tech Club 2026
</footer>

</body>
</html>
