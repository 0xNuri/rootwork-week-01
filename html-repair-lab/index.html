<header>
  <nav>

  <a href="#events">Events</a>
  <a href="#join">Join</a>

   <h1>Tech Club</h1>

</header>
<main>
  <section id="about">
<h2>About Us</h2>
<p>We are a student technology club learning how to build useful things on the web.</p>
  </section>

<section id="events">
  <h2>Upcoming Events</h2>

  <ul>
    
      <li>
        <article>
        <h3>HTML Workshop</h3>
        <p>Saturday at 10am</p>
         </article>
      </li>

    
      <li>
        <article>
        <h3>Git Practice</h3>
        <p>Sunday at 2pm</p>
         </article>
      </li>
   
  </ul>
</section>

<img src="club.jpg" alt="Tech Club's Logo">


<section id="join">
  <h2>Join the Club</h2>

  <form>
  <p><label for="name">Name</label>
    <input type="text" name="name" id="name" required> 
  </p>
  <p>
    <label for="email">Email</label>
    <input type="email" name="email" id="email" required>
  </p>  
  <fieldset>
       <legend> Why do you want to join?</legend>
   <p>       
       <label for="message">Why do you want to join?</label>
       <br>
       <textarea name="message" id="message" cols="20" rows="15" placeholder="Type your message here"></textarea>
  </p> 
       
    </fieldset>

    <button type="submit">Submit application</button>
    <button type="reset">Reset</button> 
  </form>
</section>
</main>

<footer>

</footer>
