<!DOCTYPE html>
<html>
<head>
        <title>Task Manager</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <meta name="author" content="oba nuri">
        <meta name="description" content="Developer profile for a Fullstack developer">
            <link rel="stylesheet" href="styles.css">
        <script defer src="script.js"></script>
</head>
    <body>
        <header>
             <h1 class="title"> Task Manager</h1>
        </header>
            <div class="all-tasks">
                <h2 class="task-list-title">My tasks</h2>
                <section class="task-list">
                 <div><button type="button" class="filter-btn active-filter" data-filter="all" >All</button></div>
                    <div><button type="button" class="filter-btn" data-filter="active">Active</button></div>
                    <div><button type="button" class="filter-btn" data-filter="completed"> Completed </button></div>
                </section>

            </div>
            <div class="todo-list" data-list-display-container>
                <div class="todo-header">
                    <h2 class="classlist-title" data-list-title>Active</h2>
                    <p class="classtask-count" data-list-count>3 tasks remaining</p>
                </div>
                <div class="todo-body">

                    <div class="tasks-container"></div>


                    <!--Tasks creator-->
         <div class="new-task-creator">
             <form action="" class="form" data-new-task-form>                              
                <label for="message"></label>
                <button type="submit" class="btn-create" aria-label="add-new-task">+</button>
                <input data-new-task-input type="text" id="new-task-creator" placeholder="Add New Task" class="new-task" aria-label="new-task">
                <p id="error message" class="error"></p>
             </form>


                </div>
                    <div class="delete-tasks"></div>
                    <button class=" btn-delete" id="clear-completed-btn">Clear completed tasks</button>
                    <button class="btn-delete" id="delete-all-btn">Delete all</button>
                
                </div>
            </div>
    
<footer>

</footer>
</body>
</html>
