<!DOCTYPE html>
<html>
<head>
        <title>Task Manager</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <meta name="author" content="oba nuri">
        <meta name="description" content="Developer profile for a Fullstack developer">
        <link rel="icon" href="" type="image/png">
        <link rel="stylesheet" href="styles.css">
        <script defer src="scripts.js"></script>
</head>
    <body>
        <header>
             <h1 class="title"> Task Manager</h1>
        </header>
        <main>
            <div class="all-tasks">
                <h2 class="task-list-title">My tasks</h2>
                <ul class="task-list">
                    <li class="active-list">Urgent</li>
                    <li>Priority</li>
                    <li>Unimportant</li>
                </ul>
<form action="">                              
            <label for="message">Input Task detail</label>
            <input type="text" id="message" name="message" placeholder="alarm 8:00AM" class="new-list" aria-label="new-list">
            <button type="submit" class="btn list" aria-label="add-new-list">+<button>
            <p id="error message" class="error"></p>
</form>
            </div>
            <div class="todo-list">
                <div class="todo-header">
                    <h2 class="classlist-title">Urgent</h2>
                    <p class="classtask-count">3 tasks remaining</p>
                </div>
                <div class="todo-body">

                    <!--task 1-->
                    <div class="tasks">
                        <div class="tasks">
                            <input type="checkbox" id="task-1">
                            <label for="task-1"><span class="custom-checkbox">Revise rootwork assignment</span></label> 
                        </div>

                        <!--task 2-->
                    </div>
                    <div class="tasks">
                        <div class="tasks">
                            <input type="checkbox" id="task-2">
                            <label for="task-1"><span class="custom-checkbox">Get lunck</span></label> 
                        </div>
                    </div>
                    
                    <!--Task 3-->
                    <div class="tasks">
                        <div class="tasks">
                            <input type="checkbox" id="task-3">
                            <label for="task-1"><span class="custom-checkbox">Meeting</span></label> 
                        </div>
                    </div>

                    <!--Tasks creator-->
                    <div class="new-task-creator">
         <form action="">                              
            <label for="message">Input Task detail</label>
            <input type="text" id="message" name="message" placeholder="alarm 8:00AM" class="new-list" aria-label="new-list">
            <button type="submit" class="btn list" aria-label="add-new-list">+<button>
            <p id="error message" class="error"></p>
        </form>
                    </div>
                    <div class="delete-tasks"></div>
                
                </div>
            </div>
        </main>
    
<footer>

</footer>
</body>
</html>
